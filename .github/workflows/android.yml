name: TeamTalk5 Android Build

on:
  workflow_dispatch:

jobs:
  build-arm64-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK r29
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - name: Cache Native Builds
        uses: actions/cache@v4
        with:
          path: |
            ${{runner.workspace}}/webrtc
            ${{runner.workspace}}/install-android
          key: ${{ runner.os }}-native-r29-${{ hashFiles('**/CMakeLists.txt', '**/Makefile', 'Build/**') }}
          restore-keys: |
            ${{ runner.os }}-native-r29-

      - name: Install System Dependencies
        working-directory: ${{github.workspace}}/Build
        run: |
          export JAVA_HOME=${{ env.JAVA_HOME }}
          sudo make depend-ubuntu24-android || echo "Warning: Dependency install skipped."

      - name: Build TeamTalk Library (C++ ARM64 ONLY)
        working-directory: ${{github.workspace}}/Build
        run: |
          make CMAKE_EXTRA="-G Ninja -DWEBRTC_FETCH_PATH=${{runner.workspace}}/webrtc -DCMAKE_INSTALL_PREFIX=${{runner.workspace}}/install-android" \
               CMAKE_BUILD_EXTRA="--target install" android-arm64-v8a
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      # LOGIKA INTI: CEK SECRET DAN GENERATE KEYSTORE
      - name: Setup Keystore
        working-directory: ${{github.workspace}}/Client/TeamTalkAndroid
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "[WARN] Secret kosong. Membuat keystore sementara..."
            keytool -genkeypair -v -keystore release-key.keystore \
              -alias teamtalk-release -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android123 -keypass android123 \
              -dname "CN=TeamTalk, OU=Dev, O=TeamTalk, L=Jakarta, ST=DKI, C=ID"
            
            printf "storeFile=release-key.keystore\nstorePassword=android123\nkeyAlias=teamtalk-release\nkeyPassword=android123\n" > keystore.properties
            echo "TEMPORARY_MODE=true" >> $GITHUB_ENV
          else
            echo "[OK] Menggunakan secret permanen."
            echo "$KEYSTORE_BASE64" | base64 -d > release-key.keystore
            
            printf "storeFile=release-key.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
            echo "TEMPORARY_MODE=false" >> $GITHUB_ENV
          fi

      # TAMPILKAN SHA-1 UNTUK FIREBASE
      - name: Show SHA-1 Fingerprint
        working-directory: ${{github.workspace}}/Client/TeamTalkAndroid
        run: |
          STORE_PASS=$(grep storePassword keystore.properties | cut -d= -f2)
          KEY_ALIAS_VAL=$(grep keyAlias keystore.properties | cut -d= -f2)
          
          echo "=========================================="
          echo "SHA-1 FINGERPRINT:"
          echo "=========================================="
          keytool -list -v -keystore release-key.keystore \
            -alias "$KEY_ALIAS_VAL" \
            -storepass "$STORE_PASS" 2>/dev/null | grep SHA1:
          echo "=========================================="

      # BUILD APK RELEASE
      - name: Build Release APK
        working-directory: ${{github.workspace}}/Client/TeamTalkAndroid
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # UPLOAD ARTIFACT
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeamTalk5-Release-APK
          path: Client/TeamTalkAndroid/build/outputs/apk/release/*.apk
          if-no-files-found: error
