name: TeamTalk5 Android Build (Public + Commit Tracking)

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64-apk:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout & Ambil Info Commit
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get Commit Info
        id: commit_info
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          FULL_SHA=$(git rev-parse HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%s | tr '"' "'")
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "full_sha=${FULL_SHA}" >> $GITHUB_OUTPUT
          echo "commit_msg=${COMMIT_MSG}" >> $GITHUB_OUTPUT
      
      # 2. Setup Environment
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Set up Android NDK r29
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29
      
      - name: Cache Native Builds
        uses: actions/cache@v4
        with:
          path: |
            ${{runner.workspace}}/webrtc
            ${{runner.workspace}}/install-android
          key: ${{ runner.os }}-native-r29-${{ hashFiles('**/CMakeLists.txt', '**/Makefile', 'Build/**') }}
          restore-keys: |
            ${{ runner.os }}-native-r29-
            ${{ runner.os }}-native-
      
      # 3. Build Library C++
      - name: Install System Dependencies
        working-directory: ${{github.workspace}}/Build
        run: |
          export JAVA_HOME=${{ env.JAVA_HOME }}
          sudo make depend-ubuntu24-android || echo "Warning: Dependency install skipped."
      
      - name: Build TeamTalk Library (C++ ARM64 ONLY)
        working-directory: ${{github.workspace}}/Build
        run: |
          make CMAKE_EXTRA="-G Ninja -DWEBRTC_FETCH_PATH=${{runner.workspace}}/webrtc -DCMAKE_INSTALL_PREFIX=${{runner.workspace}}/install-android" \
               CMAKE_BUILD_EXTRA="--target install" android-arm64-v8a
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          JAVA_HOME: ${{ env.JAVA_HOME }}
      
      # 4. Generate Keystore (Sesuai Kode Kamu)
      - name: Setup Keystore
        working-directory: ${{github.workspace}}/Client/TeamTalkAndroid
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "[WARN] Secret kosong. Membuat keystore sementara..."
            keytool -genkeypair -v -keystore release-key.keystore \
              -alias teamtalk-release -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android123 -keypass android123 \
              -dname "CN=TeamTalk, OU=Dev, O=TeamTalk, L=Jakarta, ST=DKI, C=ID"
            
            printf "storeFile=release-key.keystore\nstorePassword=android123\nkeyAlias=teamtalk-release\nkeyPassword=android123\n" > keystore.properties
            echo "TEMPORARY_MODE=true" >> $GITHUB_ENV
          else
            echo "[OK] Menggunakan secret permanen."
            echo "$KEYSTORE_BASE64" | base64 -d > release-key.keystore
            
            printf "storeFile=release-key.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
            echo "TEMPORARY_MODE=false" >> $GITHUB_ENV
          fi
      
      # 5. Tampilkan SHA-1 untuk Firebase
      - name: Show SHA-1 Fingerprint
        working-directory: ${{github.workspace}}/Client/TeamTalkAndroid
        run: |
          STORE_PASS=$(grep storePassword keystore.properties | cut -d= -f2)
          KEY_ALIAS_VAL=$(grep keyAlias keystore.properties | cut -d= -f2)
          
          echo "=========================================="
          echo "  SALIN SHA-1 DI BAWAH INI KE FIREBASE:"
          echo "=========================================="
          keytool -list -v -keystore release-key.keystore \
            -alias "$KEY_ALIAS_VAL" \
            -storepass "$STORE_PASS" 2>/dev/null | grep SHA1:
          echo "=========================================="
      
      # 6. Build APK dengan Inject Commit SHA
      - name: Build Release APK
        working-directory: ${{github.workspace}}/Client/TeamTalkAndroid
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PCOMMIT_SHA=${{ steps.commit_info.outputs.short_sha }} \
            -PCOMMIT_FULL=${{ steps.commit_info.outputs.full_sha }} \
            -PCOMMIT_MSG="${{ steps.commit_info.outputs.commit_msg }}"
      
      # 7. Rename APK Agar Unik & Mudah Dilacak
      - name: Rename APK with Unique Commit ID
        run: |
          mkdir -p renamed_apk
          for apk in Client/TeamTalkAndroid/build/outputs/apk/release/*.apk; do
            if [ -f "$apk" ]; then
              BASENAME=$(basename "$apk" .apk)
              # Format: app-release_[COMMIT-SHA]-PUBLIK.apk
              NEW_NAME="${BASENAME}_${{ steps.commit_info.outputs.short_sha }}-PUBLIK.apk"
              cp "$apk" "renamed_apk/${NEW_NAME}"
              echo "Renamed to: ${NEW_NAME}"
            fi
          done
      
      # 8. Upload Artifact dengan Nama Dinamis (TIDAK MONOTON)
      - name: Upload Unique APK Artifact
        uses: actions/upload-artifact@v4
        with:
          # Nama artifact sekarang unik setiap build!
          name: TeamTalk5-Public-${{ steps.commit_info.outputs.short_sha }}
          path: renamed_apk/*.apk
          if-no-files-found: error
      
      # 9. Summary Build
      - name: Build Summary
        run: |
          echo "=========================================="
          echo "  BUILD SUCCESS!"
          echo "=========================================="
          echo "  Commit SHA : ${{ steps.commit_info.outputs.short_sha }}"
          echo "  Message    : ${{ steps.commit_info.outputs.commit_msg }}"
          echo "  Artifact   : OFA-TM5-Public-${{ steps.commit_info.outputs.short_sha }}"
          echo "=========================================="
