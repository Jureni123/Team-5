name: Generate Permanent Keystore for Play Store

on:
  workflow_dispatch: # Hanya jalan kalau diklik manual

jobs:
  create-keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Generate Valid Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore teamtalk-release.keystore \
            -alias teamtalk-playstore \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass BangunPlayStore2026! \
            -keypass BangunPlayStore2026! \
            -dname "CN=TeamTalk Dev, OU=Mobile, O=BangunDev, L=Jakarta, ST=DKI, C=ID"
          
          # Encode ke Base64 biar aman disimpan di Secrets
          echo "KEYSTORE_BASE64=$(base64 -w 0 teamtalk-release.keystore)" >> $GITHUB_ENV
          echo "KEYSTORE_PROPERTIES_CONTENT=storeFile=teamtalk-release.keystore\nstorePassword=BangunPlayStore2026!\nkeyAlias=teamtalk-playstore\nkeyPassword=BangunPlayStore2026!" >> $GITHUB_ENV

      - name: Print Instructions
        run: |
          echo "=========================================="
          echo "✅ KEYSTORE BERHASIL DIBUAT!"
          echo "=========================================="
          echo ""
          echo "Nama Secret: KEYSTORE_BASE64"
          echo "Nilai:"
          echo "${{ env.KEYSTORE_BASE64 }}"
          echo ""
          echo "------------------------------------------"
          echo ""
          echo "Nama Secret: KEYSTORE_PROPERTIES"  
          echo "Nilai:"
          echo "${{ env.KEYSTORE_PROPERTIES_CONTENT }}"
          echo ""
          echo "=========================================="
          echo "️ PENTING: Copy nilai di atas ke GitHub Secrets!"
          echo "=========================================="