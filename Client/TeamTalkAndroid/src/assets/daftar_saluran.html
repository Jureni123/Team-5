<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Server K...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #fff; color: #333; }

        /* ---- HEADER ---- */
        .header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: #fff; border-bottom: 1px solid #eee; }
        .header-left, .header-right { display: flex; align-items: center; gap: 12px; }
        .back-btn { font-size: 20px; color: #333; text-decoration: none; }
        .header-title { font-size: 18px; font-weight: 600; }
        .saluran-baru { font-size: 16px; color: #333; font-weight: 500; text-decoration: none; }
        .menu-dots { font-size: 22px; color: #333; }

        /* ---- TAB NAVIGASI ---- */
        .tabs { display: flex; background: #0091EA; }
        .tab { flex: 1; padding: 12px 0; text-align: center; color: rgba(255,255,255,0.7); font-size: 15px; font-weight: 500; border-bottom: 3px solid transparent; }
        .tab.active { color: #fff; border-bottom-color: #fff; }

        /* ---- STATUS BAR ---- */
        .status-bar { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; background: #f8f9fa; font-size: 14px; border-bottom: 1px solid #eee; }
        .status-online { color: #28a745; font-weight: 500; }
        .ping { color: #dc3545; font-weight: 500; }
        .rx-tx { color: #666; }

        /* ---- AREA SALURAN ---- */
        .channel-banner { background: linear-gradient(135deg, #1E88E5, #0060D1); padding: 40px 20px; text-align: center; color: white; }
        .play-icon { width: 90px; height: 90px; margin: 0 auto 16px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .play-icon span { font-size: 40px; color: #FF9800; margin-left: 8px; }
        .channel-name { font-size: 32px; font-weight: 600; }

        /* ---- DAFTAR PENGGUNA ---- */
        .user-item { display: flex; align-items: center; padding: 16px; border-bottom: 1px solid #f0f0f0; }
        .user-avatar { width: 56px; height: 56px; border-radius: 50%; background: #4285F4; color: white; font-size: 22px; font-weight: bold; display: flex; align-items: center; justify-content: center; margin-right: 14px; flex-shrink: 0; }
        .user-info { flex: 1; min-width: 0; }
        .user-name { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
        .user-status { font-size: 14px; color: #666; line-height: 1.4; }
        .btn-pesan { padding: 8px 20px; background: #e0e0e0; border: none; border-radius: 4px; font-size: 15px; font-weight: 500; cursor: pointer; }

        /* ---- KONTROL BAWAH ---- */
        .bottom-controls { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #ddd; padding: 12px 16px; }
        .mic-control { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .mic-icon { font-size: 28px; color: #666; }
        .mic-slider { width: 48%; height: 6px; -webkit-appearance: none; background: #ddd; border-radius: 3px; outline: none; }
        .mic-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; background: #4CAF50; border-radius: 50%; cursor: pointer; }
        
        .btn-bicara { flex: 1; padding: 14px; background: #dc0000; color: white; border: none; border-radius: 6px; font-size: 20px; font-weight: bold; margin: 0 12px; cursor: pointer; }
        .speaker-icon { font-size: 28px; color: #666; }
        .speaker-slider { width: 48%; height: 6px; -webkit-appearance: none; background: #ddd; border-radius: 3px; outline: none; }
        .speaker-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; background: #2196F3; border-radius: 50%; cursor: pointer; }

        .action-buttons { display: flex; gap: 10px; margin-top: 12px; }
        .action-btn { flex: 1; padding: 10px; border: none; border-radius: 4px; font-size: 15px; font-weight: 500; cursor: pointer; }
        .btn-foto { background: #039BE5; color: white; }
        .btn-set { background: #757575; color: white; }
        .btn-file { background: #757575; color: white; }
    </style>
</head>
<body>

<!-- HEADER -->
<div class="header">
    <div class="header-left">
        <a href="#" class="back-btn" onclick="kembali()">&#8592;</a>
        <h1 class="header-title">Server K...</h1>
    </div>
    <div class="header-right">
        <a href="#" class="saluran-baru">SALURAN BARU</a>
        <span class="menu-dots">⋮</span>
    </div>
</div>

<!-- TAB -->
<div class="tabs">
    <div class="tab active">SALURAN</div>
    <div class="tab">OBROLAN</div>
    <div class="tab">MEDIA STREAM</div>
    <div class="tab">FILE</div>
</div>

<!-- STATUS -->
<div class="status-bar">
    <span class="status-online">Koneksi: Online</span>
    <span><span class="ping">Ping: 299</span> <span class="rx-tx">RX/TX: 0/0 KB</span></span>
</div>

<!-- SALURAN BANNER -->
<div class="channel-banner">
    <div class="play-icon"><span>&#9654;</span></div>
    <h2 class="channel-name">CH 1 &bull;</h2>
</div>

<!-- DAFTAR PENGGUNA -->
<div style="padding-bottom: 160px;">
    <div class="user-item">
        <div class="user-avatar">BKB</div>
        <div class="user-info">
            <div class="user-name">Bersama KitaBisa</div>
            <div class="user-status">Wehjtjktkt<br>Wehjtjktkt</div>
        </div>
        <button class="btn-pesan" onclick="kirimPesan()">PESAN</button>
    </div>
</div>

<!-- KONTROL BAWAH -->
<div class="bottom-controls">
    <div class="mic-control">
        <span class="mic-icon">🎤</span>
        <input type="range" class="mic-slider" value="50">
        <button class="btn-bicara" onmousedown="mulaiBicara()" onmouseup="berhentiBicara()">BICARA</button>
        <input type="range" class="speaker-slider" value="50">
        <span class="speaker-icon">🔊</span>
    </div>
    <div class="action-buttons">
        <button class="action-btn btn-foto" onclick="pilihFoto()">FOTO</button>
        <button class="action-btn btn-set" onclick="bukaSet()">SET</button>
        <button class="action-btn btn-file" onclick="pilihFile()">FILE</button>
    </div>
</div>

<script>
// Fungsi yang dipanggil dari HTML ke Android
function kembali() { if(window.AndroidBridge) AndroidBridge.kembali(); }
function kirimPesan() { if(window.AndroidBridge) AndroidBridge.bukaPesan(); }
function mulaiBicara() { if(window.AndroidBridge) AndroidBridge.mulaiBicara(); }
function berhentiBicara() { if(window.AndroidBridge) AndroidBridge.berhentiBicara(); }
function pilihFoto() { if(window.AndroidBridge) AndroidBridge.pilihFoto(); }
function bukaSet() { if(window.AndroidBridge) AndroidBridge.bukaPengaturan(); }
function pilihFile() { if(window.AndroidBridge) AndroidBridge.pilihFile(); }

// Fungsi dipanggil dari Android ke HTML
function perbaruiStatus(ping, rx, tx) {
    document.querySelector('.ping').textContent = 'Ping: ' + ping;
    document.querySelector('.rx-tx').textContent = 'RX/TX: ' + rx + '/' + tx + ' KB';
}

function tambahPengguna(id, nama, status, inisial) {
    // Bisa ditambahkan logika daftar pengguna dinamis
}
</script>

</body>
</html>
