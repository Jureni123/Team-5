plugins {
    alias(libs.plugins.android.application)
    // ✅ PLUGIN GOOGLE SERVICES
    id 'com.google.gms.google-services' version '4.4.0' apply false
}

def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) {
    ksFile.withInputStream { ks.load(it) }
}

android {
    namespace = 'dk.bearware.gui'
    compileSdk = 37 
    buildToolsVersion = '37.0.0'
    ndkVersion = '29.0.14206865'

    defaultConfig {
        applicationId = 'dk.bearware.gui'
        minSdk = 23
        targetSdk = 37
        versionCode = 150
        versionName = '5.22'
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
        
        // ✅ EMBED COMMIT SHA KE DALAM APK (Untuk Tracking Versi)
        def commitSha = project.hasProperty('COMMIT_SHA') ? project.COMMIT_SHA : "dev-local"
        def commitFull = project.hasProperty('COMMIT_FULL') ? project.COMMIT_FULL : "unknown"
        def commitMsg = project.hasProperty('COMMIT_MSG') ? project.COMMIT_MSG : "local build"
        
        buildConfigField "String", "GIT_COMMIT_SHA", "\"${commitSha}\""
        buildConfigField "String", "GIT_COMMIT_FULL", "\"${commitFull}\""
        buildConfigField "String", "GIT_COMMIT_MSG", "\"${commitMsg.replace('"', '\\"')}\""
    }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile = rootProject.file(ks['storeFile'])
                storePassword = ks['storePassword']
                keyAlias = ks['keyAlias']
                keyPassword = ks['keyPassword']
                
                // ✅ METODE SIGNING (V1, V2, V3)
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
                enableV4Signing = false
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (ksFile.exists()) {
                signingConfig = signingConfigs.release
            }
        }
        debug {
            if (ks['signDebug']?.toBoolean()) {
                signingConfig = signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled = true
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    androidResources {
        generateLocaleConfig = true
    }

    // ✅ HANYA ARM64-V8A
    splits {
        abi {
            enable = true
            reset()
            include 'arm64-v8a'
            universalApk = false
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = [layout.buildDirectory.dir('jniLibs-staging')]
        }
    }

    packaging {
        jniLibs {
            excludes += ['**/libTeamTalk5Pro-jni.so']
        }
        pickFirsts = [
                'META-INF/LICENSE.md',
                'META-INF/LICENSE-notice.md'
        ]
    }

    lint {
        disable 'MissingTranslation'
    }
}

tasks.register('syncJniLibs', Sync) {
    from('../../Library/TeamTalkJNI/libs') {
        include 'arm64-v8a/**'
    }
    into layout.buildDirectory.dir('jniLibs-staging')
}

afterEvaluate {
    tasks.named('preBuild').configure { dependsOn 'syncJniLibs' }
}

dependencies {
    coreLibraryDesugaring libs.desugar.jdk.libs
    implementation libs.gson
    implementation libs.androidx.annotation
    implementation libs.androidx.appcompat
    implementation libs.androidx.core
    implementation libs.androidx.fragment
    implementation libs.androidx.media
    implementation libs.androidx.preference
    implementation libs.androidx.viewpager
    implementation libs.material
    
    // ✅ FIREBASE
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.android.gms:play-services-auth:22.0.0'
     // ✅ TAMBAHKAN BARIS INI DI SINI:
    implementation 'com.google.firebase:firebase-firestore' 
    implementation 'com.github.bumptech.glide:glide:4.16.0'
annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    implementation files('../../Library/TeamTalkJNI/libs/TeamTalk5.jar')

    testImplementation libs.junit.jupiter.api
    testImplementation files('../../Library/TeamTalkJNI/libs/TeamTalk5Test.jar')

    androidTestImplementation libs.androidx.test.core
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.rules
    androidTestImplementation libs.junit.jupiter.api
    androidTestImplementation files('../../Library/TeamTalkJNI/libs/TeamTalk5Test.jar')
}

// ✅ AKTIFKAN GOOGLE SERVICES
apply plugin: 'com.google.gms.google-services'
